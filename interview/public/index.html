<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真实周生产模块 · 本地验收</title><style>body{font:16px system-ui;color:#202435;background:#f6f7fb;margin:0}main{max-width:1000px;margin:32px auto;padding:24px;background:white}button{font:inherit;padding:10px 16px;margin:4px;border:1px solid #ddd;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f5f7;padding:16px}video{width:min(100%,360px)}p{line-height:1.6}</style><main><h1>真实数字员工周生产模块</h1><p>基线20fe685 · 合成数据 · 单条已确认任务 · 仅本地执行</p><p>这是验证入口，候选人需完善任务详情、异常恢复及状态展示。真实模块执行结果在下方显示；本页不代表原产品完整界面。</p><button id="render">运行受控本地生产</button><button id="scan">运行周任务消费者</button><button id="refresh">刷新</button><pre id="message" role="status"></pre><div id="media"></div><pre id="state"></pre></main><script>
const $=id=>document.getElementById(id);async function refresh(){const r=await fetch('/api/state');const data=await r.json();$('state').textContent=JSON.stringify(data,null,2);$('media').replaceChildren();for(const a of data.artifacts){const video=document.createElement('video');video.controls=true;video.src='/api/media?artifactId='+encodeURIComponent(a.artifact_id);$('media').append(video)}}
for(const name of ['render','scan'])$(name).onclick=async()=>{try{$('message').textContent='执行中';const r=await fetch('/api/'+name,{method:'POST'});const result=await r.json();$('message').textContent=JSON.stringify({http:r.status,result},null,2);await refresh()}catch(e){$('message').textContent=e.message}};
$('refresh').onclick=refresh;refresh().catch(e=>$('message').textContent=e.message);
</script></html>
